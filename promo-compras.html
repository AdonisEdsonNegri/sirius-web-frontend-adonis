<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRIUS WEB – Módulo Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --acento:#eab308; --acento2:#fbbf24; --acento3:#d97706; --indigo:#6366f1; --cinza:#fef9c3; }
        html, body { width:100%; height:100%; overflow:hidden; font-family:'Barlow',sans-serif; cursor:pointer; user-select:none; }

        .fundo {
            width:100vw; height:100vh;
            background:
                radial-gradient(ellipse 75% 55% at 65% 28%, rgba(234,179,8,0.18) 0%, transparent 62%),
                radial-gradient(ellipse 55% 65% at 18% 78%, rgba(99,102,241,0.12) 0%, transparent 60%),
                linear-gradient(155deg, #0c0a00 0%, #160e00 50%, #0a0800 100%);
            position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;
        }
        .fundo::before { content:''; position:absolute; inset:-10%; background-image:radial-gradient(circle,rgba(234,179,8,0.28) 1px,transparent 1px); background-size:38px 38px; animation:moverGrade 21s linear infinite; opacity:0.38; }
        @keyframes moverGrade { 0%{transform:translate(0,0);} 100%{transform:translate(38px,38px);} }
        .fundo::after { content:''; position:absolute; left:0; top:42%; width:100%; height:1px; background:linear-gradient(90deg,transparent 0%,var(--acento3) 28%,var(--acento2) 58%,transparent 100%); opacity:0.18; filter:blur(2px); }

        /* Decorativo: caixas empilhadas */
        .deco-caixas { position:absolute; right:8vw; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; align-items:center; opacity:0; animation:entrarDeco 0.8s ease 0.5s forwards; }
        .cx { border-radius:8px; border:1px solid rgba(234,179,8,0.3); }
        .cx1 { width:120px; height:60px; background:linear-gradient(145deg,rgba(234,179,8,0.12),rgba(217,119,6,0.05)); }
        .cx2 { width:140px; height:70px; background:linear-gradient(145deg,rgba(234,179,8,0.10),rgba(99,102,241,0.06)); }
        .cx3 { width:110px; height:55px; background:linear-gradient(145deg,rgba(234,179,8,0.08),rgba(217,119,6,0.04)); }
        @keyframes entrarDeco { from{opacity:0;transform:translateY(-44%);} to{opacity:0.85;transform:translateY(-50%);} }

        .badge { position:absolute; top:28px; right:10vw; background:rgba(234,179,8,0.12); border:1px solid rgba(234,179,8,0.32); color:rgba(251,191,36,0.95); border-radius:20px; padding:5px 14px; font-family:'Barlow',sans-serif; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; opacity:0; animation:subir 0.5s ease 0.3s forwards; z-index:20; }

        .conteudo { position:relative; z-index:10; display:flex; flex-direction:column; align-items:flex-start; padding:0 0 0 10vw; width:100%; }
        .marca { font-family:'Barlow',sans-serif; font-weight:300; font-size:clamp(13px,1.5vw,18px); letter-spacing:8px; text-transform:uppercase; color:rgba(255,255,255,0.3); opacity:0; animation:subir 0.6s ease 0.05s forwards; margin-bottom:2px; }
        .pre-titulo { font-family:'Barlow',sans-serif; font-weight:600; font-size:clamp(11px,1.2vw,14px); letter-spacing:6px; text-transform:uppercase; color:var(--acento); opacity:0; transform:translateY(16px); animation:subir 0.6s ease 0.2s forwards; margin-bottom:8px; }

        .titulo { font-family:'Bebas Neue',sans-serif; font-size:clamp(80px,14vw,200px); line-height:0.88; letter-spacing:-3px; color:transparent; background:linear-gradient(130deg,#ffffff 0%,#fef9c3 40%,var(--acento) 68%,var(--indigo) 100%); -webkit-background-clip:text; background-clip:text; opacity:0; transform:translateX(-40px); animation:entrarEsquerda 0.8s cubic-bezier(0.16,1,0.3,1) 0.35s forwards; filter:drop-shadow(0 0 38px rgba(234,179,8,0.48)); margin-bottom:22px; }
        .separador { width:0; height:2px; background:linear-gradient(90deg,var(--acento3),var(--acento2)); border-radius:2px; opacity:0; animation:expandir 0.7s ease 0.8s forwards; margin-bottom:24px; }
        .linha-texto { display:flex; align-items:center; gap:14px; opacity:0; transform:translateY(12px); }
        .linha-texto:nth-child(6) { animation:subir 0.5s ease 1.0s forwards; }
        .linha-texto:nth-child(7) { animation:subir 0.5s ease 1.15s forwards; }
        .linha-icone { font-size:16px; }
        .linha-texto span:last-child { font-family:'Barlow',sans-serif; font-weight:300; font-size:clamp(14px,1.6vw,20px); color:rgba(255,255,255,0.75); }
        .linha-texto em { color:var(--acento2); font-style:normal; font-weight:600; }

        .rodape { position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:20px 10vw; background:linear-gradient(0deg,rgba(12,10,0,0.96) 0%,transparent 100%); opacity:0; animation:subir 0.6s ease 1.4s forwards; }
        .rodape-marca { font-family:'Barlow',sans-serif; font-weight:600; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.2); }
        .btn-fale { display:inline-flex; align-items:center; gap:10px; padding:12px 30px; background:transparent; border:1px solid rgba(234,179,8,0.6); border-radius:40px; color:var(--cinza); font-family:'Barlow',sans-serif; font-weight:600; font-size:14px; letter-spacing:3px; text-transform:uppercase; text-decoration:none; cursor:pointer; transition:all 0.3s ease; position:relative; overflow:hidden; }
        .btn-fale::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,var(--acento3),var(--acento2)); opacity:0; transition:opacity 0.3s ease; border-radius:40px; }
        .btn-fale:hover::before { opacity:1; }
        .btn-fale span { position:relative; z-index:1; }
        .btn-fale:hover { color:white; border-color:transparent; box-shadow:0 0 20px rgba(234,179,8,0.5); }
        .btn-seta { position:relative; z-index:1; font-size:16px; transition:transform 0.3s ease; }
        .btn-fale:hover .btn-seta { transform:translateX(4px); }

        @keyframes subir { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
        @keyframes entrarEsquerda { from{opacity:0;transform:translateX(-40px);} to{opacity:1;transform:translateX(0);} }
        @keyframes expandir { from{width:0;opacity:0;} to{width:180px;opacity:1;} }
    </style>
</head>
<body>
<div class="fundo" onclick="window.location.href='https://www.softclever.com.br'">
    <div class="deco-caixas"><div class="cx cx1"></div><div class="cx cx2"></div><div class="cx cx3"></div></div>
    <div class="badge">🛒 Pedido · Cotação · Recebimento</div>
    <div class="conteudo">
        <div class="marca">SIRIUS WEB</div>
        <div class="pre-titulo">Módulo</div>
        <h1 class="titulo">COMPRAS</h1>
        <div class="separador"></div>
        <div class="linha-texto"><span class="linha-icone">📋</span><span>Cotações e <em>aprovações</em> integradas</span></div>
        <div class="linha-texto"><span class="linha-icone">📦</span><span>Recebimento automático no estoque</span></div>
    </div>
    <div class="rodape">
        <div class="rodape-marca">Soft Clever Informática</div>
        <a class="btn-fale" href="https://www.softclever.com.br" target="_blank" onclick="event.stopPropagation()">
            <span>Fale Conosco</span><span class="btn-seta">→</span>
        </a>
    </div>
    <canvas id="particulas" style="position:absolute;inset:0;pointer-events:none;z-index:5;"></canvas>
</div>
<script>
    const canvas=document.getElementById('particulas'),ctx=canvas.getContext('2d');
    function r(){canvas.width=innerWidth;canvas.height=innerHeight;}r();window.addEventListener('resize',r);
    const pts=Array.from({length:26},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,rx:Math.random()*1.8+0.4,vx:(Math.random()-0.5)*0.4,vy:-(Math.random()*0.6+0.2),a:Math.random()*0.5+0.1,c:Math.random()>0.5?'234,179,8':'99,102,241'}));
    function an(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width;}ctx.beginPath();ctx.arc(p.x,p.y,p.rx,0,Math.PI*2);ctx.fillStyle=`rgba(${p.c},${p.a})`;ctx.fill();});requestAnimationFrame(an);}an();
</script>
</body>
</html>
