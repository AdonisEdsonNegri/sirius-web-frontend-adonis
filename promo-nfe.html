<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRIUS WEB – Módulo NF-e</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --azul:#2563eb; --azul-vivo:#3b82f6; --azul-glow:rgba(37,99,235,0.55); --verde:#00e5a0; --cinza:#c8d6e8; }
        html, body { width:100%; height:100%; overflow:hidden; font-family:'Barlow',sans-serif; cursor:pointer; user-select:none; }

        .fundo {
            width:100vw; height:100vh;
            background:
                radial-gradient(ellipse 80% 60% at 70% 30%, rgba(37,99,235,0.22) 0%, transparent 65%),
                radial-gradient(ellipse 60% 80% at 20% 80%, rgba(0,229,160,0.10) 0%, transparent 60%),
                linear-gradient(160deg, #040c1e 0%, #071530 45%, #060e22 100%);
            position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;
        }
        .fundo::before { content:''; position:absolute; inset:-10%; background-image:radial-gradient(circle,rgba(37,99,235,0.35) 1px,transparent 1px); background-size:36px 36px; animation:moverGrade 18s linear infinite; opacity:0.5; }
        @keyframes moverGrade { 0%{transform:translate(0,0);} 100%{transform:translate(36px,36px);} }
        .fundo::after { content:''; position:absolute; left:0; top:38%; width:100%; height:1px; background:linear-gradient(90deg,transparent 0%,var(--azul-vivo) 30%,var(--verde) 55%,var(--azul-vivo) 70%,transparent 100%); opacity:0.18; filter:blur(2px); }

        .doc-deco { position:absolute; right:-30px; top:50%; transform:translateY(-50%) rotate(12deg); width:220px; height:290px; background:linear-gradient(145deg,rgba(37,99,235,0.12),rgba(0,229,160,0.05)); border:1px solid rgba(37,99,235,0.3); border-radius:12px; opacity:0; animation:entrarDoc 0.9s ease 0.6s forwards; }
        .doc-deco::before { content:''; position:absolute; top:16px; left:16px; right:16px; height:3px; background:linear-gradient(90deg,var(--azul-vivo),var(--verde)); border-radius:2px; }
        .doc-deco::after { content:''; position:absolute; top:36px; left:16px; right:16px; bottom:16px; background:repeating-linear-gradient(0deg,transparent,transparent 14px,rgba(99,155,255,0.10) 14px,rgba(99,155,255,0.10) 15px); border-radius:4px; }
        @keyframes entrarDoc { from{opacity:0;transform:translateY(-40%) rotate(12deg);} to{opacity:1;transform:translateY(-50%) rotate(12deg);} }

        .doc-deco2 { position:absolute; right:60px; top:50%; transform:translateY(-50%) rotate(4deg); width:200px; height:270px; background:linear-gradient(145deg,rgba(20,40,100,0.5),rgba(37,99,235,0.08)); border:1px solid rgba(37,99,235,0.18); border-radius:12px; opacity:0; animation:entrarDoc2 0.9s ease 0.9s forwards; }
        @keyframes entrarDoc2 { from{opacity:0;transform:translateY(-40%) rotate(4deg);} to{opacity:0.7;transform:translateY(-50%) rotate(4deg);} }

        .badge-sefaz { position:absolute; top:28px; right:10vw; background:rgba(37,99,235,0.15); border:1px solid rgba(37,99,235,0.3); color:rgba(37,99,235,0.9); border-radius:20px; padding:5px 14px; font-family:'Barlow',sans-serif; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; opacity:0; animation:subir 0.5s ease 0.3s forwards; z-index:20; }

        .conteudo { position:relative; z-index:10; display:flex; flex-direction:column; align-items:flex-start; padding:0 0 0 10vw; width:100%; gap:0; }
        .pre-titulo { font-family:'Barlow',sans-serif; font-weight:600; font-size:clamp(11px,1.2vw,14px); letter-spacing:6px; text-transform:uppercase; color:var(--verde); opacity:0; transform:translateY(16px); animation:subir 0.6s ease 0.2s forwards; margin-bottom:8px; }
        .marca { font-family:'Barlow',sans-serif; font-weight:300; font-size:clamp(13px,1.5vw,18px); letter-spacing:8px; text-transform:uppercase; color:rgba(255,255,255,0.35); opacity:0; animation:subir 0.6s ease 0.05s forwards; margin-bottom:2px; }
        .titulo-nfe { font-family:'Bebas Neue',sans-serif; font-size:clamp(100px,18vw,240px); line-height:0.88; letter-spacing:-4px; color:transparent; background:linear-gradient(135deg,#ffffff 0%,#93c5fd 40%,var(--verde) 70%,#60a5fa 100%); -webkit-background-clip:text; background-clip:text; opacity:0; transform:translateX(-40px); animation:entrarEsquerda 0.8s cubic-bezier(0.16,1,0.3,1) 0.35s forwards; filter:drop-shadow(0 0 40px rgba(37,99,235,0.5)); margin-bottom:24px; }
        .separador { width:0; height:2px; background:linear-gradient(90deg,var(--azul-vivo),var(--verde)); border-radius:2px; opacity:0; animation:expandir 0.7s ease 0.8s forwards; margin-bottom:28px; }
        .linha-texto { display:flex; align-items:center; gap:14px; opacity:0; transform:translateY(12px); }
        .linha-texto:nth-child(6) { animation:subir 0.5s ease 1.0s forwards; }
        .linha-texto:nth-child(7) { animation:subir 0.5s ease 1.15s forwards; }
        .linha-icone { font-size:16px; }
        .linha-texto span:last-child { font-family:'Barlow',sans-serif; font-weight:300; font-size:clamp(14px,1.6vw,20px); color:rgba(255,255,255,0.75); }
        .linha-texto em { color:var(--verde); font-style:normal; font-weight:600; }

        .rodape { position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:20px 10vw; background:linear-gradient(0deg,rgba(4,12,30,0.95) 0%,transparent 100%); opacity:0; animation:subir 0.6s ease 1.4s forwards; }
        .rodape-marca { font-family:'Barlow',sans-serif; font-weight:600; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.2); }
        .btn-fale { display:inline-flex; align-items:center; gap:10px; padding:12px 30px; background:transparent; border:1px solid rgba(37,99,235,0.6); border-radius:40px; color:var(--cinza); font-family:'Barlow',sans-serif; font-weight:600; font-size:14px; letter-spacing:3px; text-transform:uppercase; text-decoration:none; cursor:pointer; transition:all 0.3s ease; position:relative; overflow:hidden; }
        .btn-fale::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,var(--azul),var(--verde)); opacity:0; transition:opacity 0.3s ease; border-radius:40px; }
        .btn-fale:hover::before { opacity:1; }
        .btn-fale span { position:relative; z-index:1; }
        .btn-fale:hover { color:white; border-color:transparent; box-shadow:0 0 20px rgba(37,99,235,0.5),0 0 60px rgba(0,229,160,0.15); }
        .btn-seta { position:relative; z-index:1; font-size:16px; transition:transform 0.3s ease; }
        .btn-fale:hover .btn-seta { transform:translateX(4px); }

        @keyframes subir { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
        @keyframes entrarEsquerda { from{opacity:0;transform:translateX(-40px);} to{opacity:1;transform:translateX(0);} }
        @keyframes expandir { from{width:0;opacity:0;} to{width:180px;opacity:1;} }
    </style>
</head>
<body>
<div class="fundo" onclick="window.location.href='https://www.softclever.com.br'">
    <div class="doc-deco2"></div>
    <div class="doc-deco"></div>
    <div class="badge-sefaz">✓ Certificado SEFAZ</div>
    <div class="conteudo">
        <div class="marca">SIRIUS WEB</div>
        <div class="pre-titulo">Módulo</div>
        <h1 class="titulo-nfe">NF-e</h1>
        <div class="separador"></div>
        <div class="linha-texto"><span class="linha-icone">⚡</span><span><em>Automatizado</em> e integrado</span></div>
        <div class="linha-texto"><span class="linha-icone">✅</span><span>Conformidade total com a legislação</span></div>
    </div>
    <div class="rodape">
        <div class="rodape-marca">Soft Clever Informática</div>
        <a class="btn-fale" href="https://www.softclever.com.br" target="_blank" onclick="event.stopPropagation()">
            <span>Fale Conosco</span><span class="btn-seta">→</span>
        </a>
    </div>
    <canvas id="particulas" style="position:absolute;inset:0;pointer-events:none;z-index:5;"></canvas>
</div>
<script>
    const canvas = document.getElementById('particulas'), ctx = canvas.getContext('2d');
    function r(){canvas.width=innerWidth;canvas.height=innerHeight;}r();window.addEventListener('resize',r);
    const pts=Array.from({length:28},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,rx:Math.random()*1.8+0.4,vx:(Math.random()-0.5)*0.4,vy:-(Math.random()*0.6+0.2),a:Math.random()*0.5+0.1,c:Math.random()>0.5?'37,99,235':'0,229,160'}));
    function an(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width;}ctx.beginPath();ctx.arc(p.x,p.y,p.rx,0,Math.PI*2);ctx.fillStyle=`rgba(${p.c},${p.a})`;ctx.fill();});requestAnimationFrame(an);}an();
</script>
</body>
</html>
