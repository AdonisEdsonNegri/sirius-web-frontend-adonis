<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRIUS WEB – ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --acento:  #2563eb;
            --acento2: #60a5fa;
            --ouro:    #f59e0b;
            --ouro2:   #fcd34d;
            --branco:  #ffffff;
            --cinza-claro: #e2e8f0;
        }
        html, body { width:100%; height:100%; overflow:hidden; font-family:'Barlow',sans-serif; cursor:pointer; user-select:none; }

        .fundo {
            width:100vw; height:100vh;
            background:
                radial-gradient(ellipse 80% 60% at 60% 25%, rgba(37,99,235,0.2) 0%, transparent 65%),
                radial-gradient(ellipse 55% 70% at 15% 80%, rgba(245,158,11,0.08) 0%, transparent 60%),
                linear-gradient(160deg, #040c1e 0%, #071530 50%, #04091a 100%);
            position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;
        }

        /* Grade fina */
        .fundo::before {
            content:''; position:absolute; inset:-10%;
            background-image: radial-gradient(circle, rgba(37,99,235,0.3) 1px, transparent 1px);
            background-size:36px 36px;
            animation:moverGrade 20s linear infinite; opacity:0.4;
        }
        @keyframes moverGrade{0%{transform:translate(0,0);}100%{transform:translate(36px,36px);}}

        /* Linha dourada */
        .fundo::after {
            content:''; position:absolute; left:0; top:40%;
            width:100%; height:1px;
            background:linear-gradient(90deg,transparent 0%,var(--acento) 25%,var(--ouro) 55%,var(--acento) 80%,transparent 100%);
            opacity:0.2; filter:blur(1px);
        }

        /* Hexágonos interligados */
        .deco-hexs {
            position:absolute; right:5vw; top:50%; transform:translateY(-50%);
            width:260px; height:280px;
            opacity:0; animation:entrarDeco 0.9s ease 0.5s forwards;
        }
        .hex {
            position:absolute;
            width:60px; height:52px;
            border:1px solid rgba(37,99,235,0.35);
            clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
            background:rgba(37,99,235,0.06);
        }
        .hex.gold { border-color:rgba(245,158,11,0.4); background:rgba(245,158,11,0.06); }
        .hex:nth-child(1){top:0;left:80px;}
        .hex:nth-child(2){top:60px;left:20px;}
        .hex:nth-child(3){top:60px;left:140px; }
        .hex:nth-child(4){top:120px;left:80px;}
        .hex:nth-child(5){top:120px;left:200px;}
        .hex:nth-child(6){top:180px;left:20px;}
        .hex:nth-child(7){top:180px;left:140px;}
        .hex:nth-child(8){top:240px;left:80px;}
        @keyframes entrarDeco{from{opacity:0;transform:translateY(-40%);}to{opacity:1;transform:translateY(-50%);}}

        .conteudo { position:relative; z-index:10; display:flex; flex-direction:column; align-items:flex-start; padding:0 0 0 10vw; width:100%; }

        .marca { font-family:'Barlow',sans-serif; font-weight:300; font-size:clamp(13px,1.5vw,18px); letter-spacing:8px; text-transform:uppercase; color:rgba(255,255,255,0.3); opacity:0; animation:subir 0.6s ease 0.05s forwards; margin-bottom:2px; }
        .pre-titulo { font-family:'Barlow',sans-serif; font-weight:600; font-size:clamp(11px,1.2vw,14px); letter-spacing:6px; text-transform:uppercase; color:var(--ouro); opacity:0; transform:translateY(16px); animation:subir 0.6s ease 0.2s forwards; margin-bottom:6px; }

        .titulo-modulo {
            font-family:'Bebas Neue',sans-serif;
            font-size:clamp(110px,20vw,280px);
            line-height:0.85; letter-spacing:-6px;
            color:transparent;
            background:linear-gradient(130deg,#ffffff 0%,#bfdbfe 30%,var(--acento2) 55%,var(--ouro) 80%,#fcd34d 100%);
            -webkit-background-clip:text; background-clip:text;
            opacity:0; transform:translateX(-40px);
            animation:entrarEsquerda 0.8s cubic-bezier(0.16,1,0.3,1) 0.35s forwards;
            filter:drop-shadow(0 0 50px rgba(37,99,235,0.5)) drop-shadow(0 0 30px rgba(245,158,11,0.2));
            margin-bottom:4px;
        }

        .subtitulo-gestao {
            font-family:'Barlow',sans-serif; font-weight:600; font-size:clamp(14px,2vw,24px);
            letter-spacing:4px; text-transform:uppercase;
            color:transparent;
            background:linear-gradient(90deg,var(--acento2),var(--ouro));
            -webkit-background-clip:text; background-clip:text;
            opacity:0; transform:translateX(-30px);
            animation:entrarEsquerda 0.8s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;
            margin-bottom:20px;
        }

        .separador { width:0; height:2px; background:linear-gradient(90deg,var(--acento),var(--ouro)); border-radius:2px; opacity:0; animation:expandir 0.7s ease 0.8s forwards; margin-bottom:20px; }

        /* Chips de módulos */
        .chips { display:flex; flex-wrap:wrap; gap:8px; max-width:560px; opacity:0; animation:subir 0.6s ease 1.0s forwards; }
        .chip {
            font-family:'Barlow',sans-serif; font-size:clamp(11px,1.1vw,13px);
            font-weight:600; letter-spacing:1.5px; text-transform:uppercase;
            padding:5px 12px; border-radius:20px;
            border:1px solid rgba(37,99,235,0.35);
            color:rgba(148,186,255,0.85);
            background:rgba(37,99,235,0.08);
        }
        .chip.gold-chip { border-color:rgba(245,158,11,0.35); color:rgba(253,211,77,0.85); background:rgba(245,158,11,0.07); }

        .badge { position:absolute; top:28px; right:10vw; background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.35); color:rgba(245,158,11,0.95); border-radius:20px; padding:5px 14px; font-family:'Barlow',sans-serif; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; opacity:0; animation:subir 0.5s ease 0.3s forwards; z-index:20; }

        .rodape { position:absolute; bottom:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:20px 10vw; background:linear-gradient(0deg,rgba(4,12,30,0.95) 0%,transparent 100%); opacity:0; animation:subir 0.6s ease 1.4s forwards; }
        .rodape-marca { font-family:'Barlow',sans-serif; font-weight:600; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.2); }

        .btn-fale { display:inline-flex; align-items:center; gap:10px; padding:12px 30px; background:transparent; border:1px solid rgba(245,158,11,0.5); border-radius:40px; color:var(--cinza-claro); font-family:'Barlow',sans-serif; font-weight:600; font-size:14px; letter-spacing:3px; text-transform:uppercase; text-decoration:none; cursor:pointer; transition:all 0.3s ease; position:relative; overflow:hidden; }
        .btn-fale::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,var(--acento),var(--ouro)); opacity:0; transition:opacity 0.3s ease; border-radius:40px; }
        .btn-fale:hover::before { opacity:1; }
        .btn-fale span,.btn-seta { position:relative; z-index:1; }
        .btn-fale:hover { color:white; border-color:transparent; box-shadow:0 0 24px rgba(245,158,11,0.4),0 0 60px rgba(37,99,235,0.2); outline:none; }
        .btn-seta { font-size:16px; transition:transform 0.3s ease; }
        .btn-fale:hover .btn-seta { transform:translateX(4px); }

        @keyframes subir{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
        @keyframes entrarEsquerda{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:translateX(0);}}
        @keyframes expandir{from{width:0;opacity:0;}to{width:240px;opacity:1;}}
    </style>
</head>
<body>
<div class="fundo" onclick="window.location.href='https://www.softclever.com.br'">
    <div class="deco-hexs">
        <div class="hex"></div><div class="hex gold"></div><div class="hex"></div>
        <div class="hex gold"></div><div class="hex"></div><div class="hex"></div>
        <div class="hex gold"></div><div class="hex"></div>
    </div>
    <div class="badge">★ Solução Completa</div>
    <div class="conteudo">
        <div class="marca">SIRIUS WEB</div>
        <div class="pre-titulo">Sistema Integrado de Gestão</div>
        <h1 class="titulo-modulo">ERP</h1>
        <div class="subtitulo-gestao">Gestão Empresarial Completa</div>
        <div class="separador"></div>
        <div class="chips">
            <span class="chip">Produção</span>
            <span class="chip gold-chip">Compras</span>
            <span class="chip">Vendas</span>
            <span class="chip gold-chip">Estoque</span>
            <span class="chip">Fiscal</span>
            <span class="chip gold-chip">Financeiro</span>
            <span class="chip">Expedição</span>
            <span class="chip gold-chip">Cobrança</span>
        </div>
    </div>
    <div class="rodape">
        <div class="rodape-marca">Soft Clever Informática</div>
        <a class="btn-fale" href="https://www.softclever.com.br" onclick="event.stopPropagation()">
            <span>Fale Conosco</span><span class="btn-seta">→</span>
        </a>
    </div>
    <canvas id="particulas" style="position:absolute;inset:0;pointer-events:none;z-index:5;"></canvas>
</div>
<script>
    const canvas=document.getElementById('particulas'),ctx=canvas.getContext('2d');
    function r(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
    r();window.addEventListener('resize',r);
    const ps=Array.from({length:32},()=>({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*2+0.4,vx:(Math.random()-0.5)*0.4,vy:-(Math.random()*0.6+0.2),alpha:Math.random()*0.5+0.1,cor:Math.random()>0.6?'37,99,235':Math.random()>0.5?'96,165,250':'245,158,11'}));
    function anim(){ctx.clearRect(0,0,canvas.width,canvas.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width;}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.cor},${p.alpha})`;ctx.fill();});requestAnimationFrame(anim);}
    anim();
    document.querySelector('.fundo').addEventListener('click',function(e){const d=document.createElement('div');d.style.cssText=`position:fixed;left:${e.clientX-30}px;top:${e.clientY-30}px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,0.5),transparent);pointer-events:none;z-index:9999;animation:ripple 0.5s ease forwards;`;const s=document.createElement('style');s.textContent='@keyframes ripple{from{transform:scale(1);opacity:1}to{transform:scale(6);opacity:0}}';document.head.appendChild(s);document.body.appendChild(d);setTimeout(()=>d.remove(),500);});
</script>
</body>
</html>
