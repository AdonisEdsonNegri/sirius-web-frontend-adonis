<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRIUS WEB</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #040c1e;
            font-family: 'Segoe UI', sans-serif;
        }

        /* =============================================
           IFRAME QUE EXIBE CADA TELA PROMOCIONAL
           ============================================= */
        #frame-promo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.35s ease;
            /* Impedir que o iframe capture cliques e
               redirecione para o site antes da hora */
            pointer-events: none;
        }

        #frame-promo.visivel {
            opacity: 1;
        }

        /* =============================================
           BARRA DE PROGRESSO (discreta, no topo)
           ============================================= */
        #barra-progresso {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #00e5a0);
            z-index: 9999;
            transition: width linear;
            border-radius: 0 2px 2px 0;
        }

        /* =============================================
           INDICADORES DE PASSO (bolinhas no rodapé)
           ============================================= */
        #indicadores {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 9999;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .dot.ativo {
            background: rgba(255, 255, 255, 0.85);
            transform: scale(1.3);
        }

        .dot.concluido {
            background: rgba(255, 255, 255, 0.45);
        }

        /* =============================================
           TELA DE ENCERRAMENTO (fade final para o login)
           ============================================= */
        #overlay-final {
            position: fixed;
            inset: 0;
            background: #040c1e;
            opacity: 0;
            pointer-events: none;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        #overlay-final.ativo {
            opacity: 1;
        }

        /* =============================================
           BOTÃO FALE CONOSCO (documento pai)
           Fica por cima do iframe — clicável sempre
           ============================================= */
        #btn-fale-conosco {
            position: fixed;
            bottom: 32px;
            right: 10vw;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid rgba(37, 99, 235, 0.6);
            border-radius: 40px;
            color: #c8d6e8;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            z-index: 9998;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        #btn-fale-conosco::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #2563eb, #00e5a0);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 40px;
        }

        #btn-fale-conosco:hover::before { opacity: 1; }

        #btn-fale-conosco span { position: relative; z-index: 1; }

        #btn-fale-conosco:hover {
            color: white;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(37,99,235,0.5), 0 0 60px rgba(0,229,160,0.15);
        }

        .seta-btn {
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        #btn-fale-conosco:hover .seta-btn { transform: translateX(4px); }
    </style>
</head>
<body>

    <!-- Barra de progresso global -->
    <div id="barra-progresso"></div>

    <!-- Botão Fale Conosco — no documento pai, sempre clicável -->
    <a id="btn-fale-conosco"
       href="https://www.softclever.com.br"
       target="_blank"
       onclick="event.stopPropagation()">
        <span>Fale Conosco</span>
        <span class="seta-btn">→</span>
    </a>

    <!-- Iframe onde cada tela é exibida -->
    <iframe id="frame-promo" src="" title="Apresentação SIRIUS WEB"></iframe>

    <!-- Bolinhas indicadoras de passo -->
    <div id="indicadores"></div>

    <!-- Overlay para fade final antes do login -->
    <div id="overlay-final"></div>

<script>
    /* ============================================================
       CONFIGURAÇÃO
       ============================================================ */

    // Pool completo de telas disponíveis
    const TODAS_AS_TELAS = [
        'promo-comandas.html',
        'promo-delivery.html',
        'promo-NFCe.html',
        'promo-NFe.html',
        'promo-compras.html',
        'promo-financeiro.html',
        'promo-xml.html',
        'promo-estoque.html',
        'promo-controle-de-caixa.html',
        'promo-comissoes.html'
    ];

    const QTDE_TELAS      = 4;       // quantas telas exibir por sessão
    const DURACAO_MS      = 3000;    // duração de cada tela em milissegundos
    const FADE_MS         = 350;     // duração do fade entre telas (ms)
    const DESTINO_FINAL   = 'login.html';  // para onde redirecionar ao final

    /* ============================================================
       SORTEAR 4 TELAS SEM REPETIÇÃO
       ============================================================ */
    function sortearTelas(pool, qtde) {
        const copia = [...pool];
        const sorteadas = [];
        for (let i = 0; i < qtde && copia.length > 0; i++) {
            const idx = Math.floor(Math.random() * copia.length);
            sorteadas.push(copia.splice(idx, 1)[0]);
        }
        return sorteadas;
    }

    /* ============================================================
       CRIAR BOLINHAS INDICADORAS
       ============================================================ */
    function criarIndicadores(qtde) {
        const container = document.getElementById('indicadores');
        container.innerHTML = '';
        for (let i = 0; i < qtde; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${i}`;
            container.appendChild(dot);
        }
    }

    function atualizarIndicadores(passo) {
        for (let i = 0; i < QTDE_TELAS; i++) {
            const dot = document.getElementById(`dot-${i}`);
            dot.className = 'dot';
            if (i < passo)  dot.classList.add('concluido');
            if (i === passo) dot.classList.add('ativo');
        }
    }

    /* ============================================================
       BARRA DE PROGRESSO
       ============================================================ */
    function animarBarra(passoAtual, totalPassos, duracaoMs) {
        const barra = document.getElementById('barra-progresso');
        const porcentagemInicio = (passoAtual / totalPassos) * 100;
        const porcentagemFim    = ((passoAtual + 1) / totalPassos) * 100;

        // Começar no ponto atual
        barra.style.transition = 'none';
        barra.style.width      = porcentagemInicio + '%';

        // Forçar reflow para a transição funcionar
        barra.getBoundingClientRect();

        // Animar até o próximo ponto na duração da tela
        barra.style.transition = `width ${duracaoMs}ms linear`;
        barra.style.width      = porcentagemFim + '%';
    }

    /* ============================================================
       ORQUESTRADOR PRINCIPAL
       ============================================================ */
    const telasSorteadas = sortearTelas(TODAS_AS_TELAS, QTDE_TELAS);
    const frame          = document.getElementById('frame-promo');
    const overlayFinal   = document.getElementById('overlay-final');

    let passoAtual = 0;

    criarIndicadores(QTDE_TELAS);

    function exibirTela(indice) {
        if (indice >= telasSorteadas.length) {
            // ✅ Todas as telas exibidas → redirecionar para o login
            encerrar();
            return;
        }

        const arquivo = telasSorteadas[indice];

        // Fade OUT do iframe atual
        frame.classList.remove('visivel');

        setTimeout(() => {
            // Trocar o src enquanto está invisível
            frame.src = arquivo;

            // Atualizar indicadores e barra
            atualizarIndicadores(indice);
            animarBarra(indice, QTDE_TELAS, DURACAO_MS);

            // Aguardar o carregamento do iframe e então fazer fade IN
            frame.onload = () => {
                frame.classList.add('visivel');

                // Aguardar a duração da tela e avançar
                setTimeout(() => {
                    passoAtual++;
                    exibirTela(passoAtual);
                }, DURACAO_MS);
            };

            // Fallback: se o onload demorar mais de 500ms, avançar mesmo assim
            setTimeout(() => {
                if (!frame.classList.contains('visivel')) {
                    frame.classList.add('visivel');
                    setTimeout(() => {
                        passoAtual++;
                        exibirTela(passoAtual);
                    }, DURACAO_MS);
                }
            }, 500);

        }, FADE_MS);
    }

    function encerrar() {
        // Fade para escuro antes de ir ao login
        frame.classList.remove('visivel');
        overlayFinal.classList.add('ativo');

        setTimeout(() => {
            window.location.href = DESTINO_FINAL;
        }, 550);
    }

    // ✅ Iniciar após um breve delay para a página terminar de carregar
    setTimeout(() => {
        exibirTela(0);
    }, 100);

    /* ============================================================
       ATALHO: qualquer clique avança para o próximo
       (mantém a consistência com o comportamento das telas promo)
       ============================================================ */
    document.addEventListener('click', () => {
        // Cancelar o temporizador atual e avançar imediatamente
        passoAtual++;
        exibirTela(passoAtual);
    });

    /* ============================================================
       ATALHO: tecla ESC ou Enter pula direto para o login
       ============================================================ */
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === 'Enter') {
            encerrar();
        }
    });
</script>

</body>
</html>
