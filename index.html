<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRIUS WEB</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #040c1e;
            font-family: 'Segoe UI', sans-serif;
        }

        /* =============================================
           IFRAME QUE EXIBE CADA TELA PROMOCIONAL
           ============================================= */
        #frame-promo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.35s ease;
            /* Impedir que o iframe capture cliques */
            pointer-events: none;
        }

        #frame-promo.visivel {
            opacity: 1;
        }

        /* =============================================
           BARRA DE PROGRESSO (discreta, no topo)
           ============================================= */
        #barra-progresso {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #00e5a0);
            z-index: 9999;
            transition: width linear;
            border-radius: 0 2px 2px 0;
        }

        /* =============================================
           INDICADORES DE PASSO (bolinhas no rodapé)
           ============================================= */
        #indicadores {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 9999;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .dot.ativo {
            background: rgba(255, 255, 255, 0.85);
            transform: scale(1.3);
        }

        .dot.concluido {
            background: rgba(255, 255, 255, 0.45);
        }

        /* =============================================
           TELA DE ENCERRAMENTO (fade final para o login)
           ============================================= */
        #overlay-final {
            position: fixed;
            inset: 0;
            background: #040c1e;
            opacity: 0;
            pointer-events: none;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        #overlay-final.ativo {
            opacity: 1;
        }

        /* =============================================
           ZONA CLICÁVEL "FALE CONOSCO"
           Área transparente sobre o botão do iframe.
           Fica z-index alto para capturar o clique
           sem mostrar nada visualmente.
           ============================================= */
        #zona-fale {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 280px;   /* cobre a largura do btn-fale nas telas promo */
            height: 80px;   /* cobre a altura do rodapé */
            z-index: 9998;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Barra de progresso global -->
    <div id="barra-progresso"></div>

    <!-- Iframe onde cada tela é exibida -->
    <iframe id="frame-promo" src="" title="Apresentação SIRIUS WEB"></iframe>

    <!-- Zona transparente clicável sobre o botão "Fale Conosco" das telas promo -->
    <div id="zona-fale" title="Fale Conosco - Soft Clever Informática"></div>

    <!-- Bolinhas indicadoras de passo -->
    <div id="indicadores"></div>

    <!-- Overlay para fade final antes do login -->
    <div id="overlay-final"></div>

<script>
    /* ============================================================
       CONFIGURAÇÃO
       ============================================================ */

    // Pool completo de telas disponíveis
    const TODAS_AS_TELAS = [
        'promo-comandas.html',
        'promo-delivery.html',
        'promo-NFCe.html',
        'promo-NFe.html',
        'promo-compras.html',
        'promo-financeiro.html',
        'promo-xml.html',
        'promo-estoque.html',
        'promo-controle-de-caixa.html',
        'promo-comissoes.html'
    ];

    const QTDE_TELAS    = 4;              // quantas telas exibir por sessão
    const DURACAO_MS    = 3000;           // duração de cada tela em ms
    const FADE_MS       = 350;            // duração do fade entre telas (ms)
    const DESTINO_FINAL = 'login.html';   // para onde redirecionar ao final
    const SITE_URL      = 'https://www.softclever.com.br';

    /* ============================================================
       SORTEAR TELAS SEM REPETIÇÃO
       ============================================================ */
    function sortearTelas(pool, qtde) {
        const copia    = [...pool];
        const sorteadas = [];
        for (let i = 0; i < qtde && copia.length > 0; i++) {
            const idx = Math.floor(Math.random() * copia.length);
            sorteadas.push(copia.splice(idx, 1)[0]);
        }
        return sorteadas;
    }

    /* ============================================================
       CRIAR BOLINHAS INDICADORAS
       ============================================================ */
    function criarIndicadores(qtde) {
        const container = document.getElementById('indicadores');
        container.innerHTML = '';
        for (let i = 0; i < qtde; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id        = `dot-${i}`;
            container.appendChild(dot);
        }
    }

    function atualizarIndicadores(passo) {
        for (let i = 0; i < QTDE_TELAS; i++) {
            const dot = document.getElementById(`dot-${i}`);
            dot.className = 'dot';
            if (i < passo)   dot.classList.add('concluido');
            if (i === passo) dot.classList.add('ativo');
        }
    }

    /* ============================================================
       BARRA DE PROGRESSO
       ============================================================ */
    function animarBarra(passoAtual, totalPassos, duracaoMs) {
        const barra = document.getElementById('barra-progresso');
        const ini   = (passoAtual / totalPassos) * 100;
        const fim   = ((passoAtual + 1) / totalPassos) * 100;

        barra.style.transition = 'none';
        barra.style.width      = ini + '%';
        barra.getBoundingClientRect(); // forçar reflow
        barra.style.transition = `width ${duracaoMs}ms linear`;
        barra.style.width      = fim + '%';
    }

    /* ============================================================
       ORQUESTRADOR PRINCIPAL
       ============================================================ */
    const telasSorteadas = sortearTelas(TODAS_AS_TELAS, QTDE_TELAS);
    const frame          = document.getElementById('frame-promo');
    const overlayFinal   = document.getElementById('overlay-final');

    let passoAtual = 0;

    criarIndicadores(QTDE_TELAS);

    function exibirTela(indice) {
        if (indice >= telasSorteadas.length) {
            encerrar();
            return;
        }

        const arquivo = telasSorteadas[indice];

        // Fade OUT
        frame.classList.remove('visivel');

        setTimeout(() => {
            frame.src = arquivo;

            atualizarIndicadores(indice);
            animarBarra(indice, QTDE_TELAS, DURACAO_MS);

            frame.onload = () => {
                frame.classList.add('visivel');
                setTimeout(() => {
                    passoAtual++;
                    exibirTela(passoAtual);
                }, DURACAO_MS);
            };

            // Fallback: se onload demorar mais de 500ms
            setTimeout(() => {
                if (!frame.classList.contains('visivel')) {
                    frame.classList.add('visivel');
                    setTimeout(() => {
                        passoAtual++;
                        exibirTela(passoAtual);
                    }, DURACAO_MS);
                }
            }, 500);

        }, FADE_MS);
    }

    function encerrar() {
        frame.classList.remove('visivel');
        overlayFinal.classList.add('ativo');
        setTimeout(() => { window.location.href = DESTINO_FINAL; }, 550);
    }

    // Iniciar
    setTimeout(() => { exibirTela(0); }, 100);

    /* ============================================================
       ZONA "FALE CONOSCO" — abre o site sem avançar o slide
       ============================================================ */
    document.getElementById('zona-fale').addEventListener('click', function(e) {
        e.stopPropagation(); // não avança o slide
        window.open(SITE_URL, '_blank');
    });

    /* ============================================================
       CLIQUE GERAL — avança para o próximo slide
       (o stopPropagation da zona-fale garante que ela não chegue aqui)
       ============================================================ */
    document.addEventListener('click', () => {
        passoAtual++;
        exibirTela(passoAtual);
    });

    /* ============================================================
       ATALHOS DE TECLADO
       ============================================================ */
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === 'Enter') {
            encerrar();
        }
    });
</script>

</body>
</html>
